name: Publish to NuGet

on:
  release:
    types: [ published ]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The package version comes from the tag, so tag, release, and published package
      # cannot disagree. A tag of v2.0.0 produces packages versioned 2.0.0.
      - name: Derive version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "Refusing to publish: tag name is empty." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Verify the tag matches VersionPrefix
        run: |
          PREFIX=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if [ "$PREFIX" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${{ steps.version.outputs.version }} does not match VersionPrefix $PREFIX." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore Pdnd.Metadata.slnx

      - name: Build
        run: dotnet build Pdnd.Metadata.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Pdnd.Metadata.slnx --configuration Release --no-build

      - name: Pack
        run: |
          for project in \
            src/Pdnd.Metadata/Pdnd.Metadata.csproj \
            src/Pdnd.Metadata.AspNetCore/Pdnd.Metadata.AspNetCore.csproj \
            src/Pdnd.Metadata.Diagnostics/Pdnd.Metadata.Diagnostics.csproj
          do
            dotnet pack "$project" --configuration Release --no-build \
              -p:PackageVersion=${{ steps.version.outputs.version }} --output ./nupkgs
          done

      # A package missing a target framework or its icon is not obviously broken: nuget.org
      # accepts it and the gap only shows on the package page. Refuse to publish instead.
      - name: Verify package contents
        run: |
          status=0
          for package in ./nupkgs/*.nupkg; do
            listing=$(unzip -l "$package")
            for entry in "lib/net8.0/" "lib/net10.0/" "icon.png" "README.md"; do
              if ! grep -q "$entry" <<< "$listing"; then
                echo "::error file=$package::missing $entry"
                status=1
              fi
            done
          done
          exit $status

      - name: Push to NuGet
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
