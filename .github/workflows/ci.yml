name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    # Restores the permission the standalone Commitlint workflow declared. The action reads
    # pull request metadata to determine the commit range on pull_request events.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Pdnd.Metadata.slnx

      - name: Build
        run: dotnet build Pdnd.Metadata.slnx --configuration Release --no-restore

      # The runner is selected in global.json. --collect and --results-directory are VSTest
      # options and have no equivalent here: under Microsoft.Testing.Platform each data
      # collector contributes its own option, so coverage needs a dedicated extension package.
      - name: Test
        run: dotnet test Pdnd.Metadata.slnx --configuration Release --no-build

  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the corpus structure
        run: python3 spec/vectors/validate.py

      # The second implementation is the only mechanism that keeps the specification honest,
      # so it is gated in CI rather than run by hand.
      - name: Run the corpus against the Python reference implementation
        working-directory: spec/reference/python
        run: python3 conformance.py

      # The SVG files are generated. Regenerating must be a no-op, otherwise someone edited
      # the output instead of the generator and the figures have started to drift apart.
      - name: Check the diagrams match their generator
        run: |
          python3 assets/diagrams/build.py
          git diff --exit-code -- assets/diagrams
