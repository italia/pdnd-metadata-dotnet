<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-labelledby="figTitle figDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><title id="figTitle">Conformance model</title><desc id="figDesc">The specification and its vector corpus form a contract that independent implementations satisfy and anyone can verify.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="#A9B4C0" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="336" y="48" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#0066CC" dominant-baseline="central">THE CONTRACT</text><rect x="336" y="64" width="288" height="88" rx="8" fill="#EAF2FB" stroke="#B4D2F0" stroke-width="1"/><text x="480" y="92" text-anchor="middle" font-size="13" font-weight="500" fill="#0066CC" dominant-baseline="central">Specification 1.1.0</text><text x="480" y="116" text-anchor="middle" font-size="10" fill="#0066CC" dominant-baseline="central">canonical vocabulary · 30 vectors</text><line x1="480" y1="160" x2="152" y2="208" stroke="#A9B4C0" stroke-width="1.25" marker-end="url(#tip)"/><line x1="480" y1="160" x2="480" y2="208" stroke="#A9B4C0" stroke-width="1.25" marker-end="url(#tip)"/><line x1="480" y1="160" x2="808" y2="208" stroke="#A9B4C0" stroke-width="1.25" marker-end="url(#tip)"/><rect x="72" y="216" width="160" height="96" rx="8" fill="#EDF5F0" stroke="#B5D4C2" stroke-width="1"/><text x="152" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#0F1720" dominant-baseline="central">Pdnd.Metadata</text><text x="152" y="264" text-anchor="middle" font-size="10" fill="#5F6C7B" dominant-baseline="central">C# .NET</text><text x="152" y="288" text-anchor="middle" font-size="10.5" fill="#17693C" dominant-baseline="central">30 / 30</text><rect x="400" y="216" width="160" height="96" rx="8" fill="#EDF5F0" stroke="#B5D4C2" stroke-width="1"/><text x="480" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#0F1720" dominant-baseline="central">reference</text><text x="480" y="264" text-anchor="middle" font-size="10" fill="#5F6C7B" dominant-baseline="central">Python</text><text x="480" y="288" text-anchor="middle" font-size="10.5" fill="#17693C" dominant-baseline="central">30 / 30</text><rect x="728" y="216" width="160" height="96" rx="8" fill="#F5F7F9" stroke="#DCE3EA" stroke-width="1" stroke-dasharray="4 4"/><text x="808" y="244" text-anchor="middle" font-size="13" font-weight="500" fill="#0F1720" dominant-baseline="central">your implementation</text><text x="808" y="264" text-anchor="middle" font-size="10" fill="#5F6C7B" dominant-baseline="central">any language</text><text x="808" y="288" text-anchor="middle" font-size="10.5" fill="#8A97A6" dominant-baseline="central">run the corpus</text><line x1="32" y1="336" x2="928" y2="336" stroke="#DCE3EA" stroke-width="1"/><text x="32" y="360" text-anchor="start" font-size="10" fill="#8A97A6" dominant-baseline="central">Conformance is a verifiable claim, not a certification. There is no authority and no badge: anyone can run the corpus and check it.</text></svg>
