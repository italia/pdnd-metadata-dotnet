<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="figTitle figDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><title id="figTitle">Where Pdnd.Metadata sits</title><desc id="figDesc">The library runs as ASP.NET Core middleware inside the provider service, after the reverse proxy and before validation, and never participates in the trust decision.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="#5A6773" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="32" y="56" width="176" height="72" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1" stroke-dasharray="4 4"/><text x="32" y="40" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">PLATFORM</text><text x="120" y="82" text-anchor="middle" font-size="13" font-weight="500" fill="#E7EAEE" dominant-baseline="central">PDND</text><text x="120" y="102" text-anchor="middle" font-size="10.5" fill="#9AA6B2" dominant-baseline="central">issues the voucher</text><rect x="32" y="184" width="176" height="72" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><text x="32" y="168" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">CONSUMER</text><text x="120" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#E7EAEE" dominant-baseline="central">Fruitore</text><text x="120" y="230" text-anchor="middle" font-size="10.5" fill="#9AA6B2" dominant-baseline="central">calls the e-service</text><line x1="120" y1="136" x2="120" y2="176" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)" stroke-dasharray="4 4"/><text x="132" y="156" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">voucher</text><rect x="240" y="184" width="128" height="72" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><text x="240" y="168" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">EDGE</text><text x="304" y="210" text-anchor="middle" font-size="13" font-weight="500" fill="#E7EAEE" dominant-baseline="central">Reverse proxy</text><text x="304" y="230" text-anchor="middle" font-size="10.5" fill="#9AA6B2" dominant-baseline="central">TLS, forwarded</text><line x1="216" y1="220" x2="232" y2="220" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)"/><line x1="376" y1="220" x2="392" y2="220" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)"/><rect x="400" y="136" width="528" height="216" rx="8" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="400" y="120" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">PROVIDER SERVICE · ASP.NET CORE</text><text x="424" y="164" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">Middleware pipeline</text><rect x="424" y="180" width="144" height="64" rx="6" fill="#14243A" stroke="#2D5688" stroke-width="1"/><text x="496" y="202" text-anchor="middle" font-size="13" font-weight="500" fill="#5AA2F0" dominant-baseline="central">Pdnd.Metadata</text><text x="496" y="222" text-anchor="middle" font-size="10.5" fill="#5AA2F0" dominant-baseline="central">extract, normalize</text><rect x="592" y="180" width="144" height="64" rx="6" fill="#1A2029" stroke="#2B333C" stroke-width="1" stroke-dasharray="4 4"/><text x="664" y="202" text-anchor="middle" font-size="13" font-weight="500" fill="#E7EAEE" dominant-baseline="central">Validation</text><text x="664" y="222" text-anchor="middle" font-size="10.5" fill="#D9A055" dominant-baseline="central">not in this library</text><rect x="760" y="180" width="144" height="64" rx="6" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><text x="832" y="202" text-anchor="middle" font-size="13" font-weight="500" fill="#E7EAEE" dominant-baseline="central">Your endpoints</text><text x="832" y="222" text-anchor="middle" font-size="10.5" fill="#9AA6B2" dominant-baseline="central">business logic</text><line x1="576" y1="212" x2="584" y2="212" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)"/><line x1="744" y1="212" x2="752" y2="212" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)"/><line x1="424" y1="272" x2="904" y2="272" stroke="#2B333C" stroke-width="1"/><rect x="424" y="288" width="144" height="48" rx="6" fill="#14243A" stroke="#2D5688" stroke-width="1"/><text x="496" y="312" text-anchor="middle" font-size="12" font-weight="500" fill="#5AA2F0" dominant-baseline="central">Diagnostics</text><text x="592" y="302" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">Activity tags and a request counter,</text><text x="592" y="320" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">read by any OpenTelemetry exporter</text><line x1="496" y1="248" x2="496" y2="280" stroke="#5A6773" stroke-width="1.25" marker-end="url(#tip)" stroke-dasharray="4 4"/><line x1="32" y1="376" x2="928" y2="376" stroke="#2B333C" stroke-width="1"/><line x1="32" y1="400" x2="60" y2="400" stroke="#5A6773" stroke-width="1.25"/><text x="70" y="400" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">request path</text><line x1="174" y1="400" x2="202" y2="400" stroke="#5A6773" stroke-width="1.25" stroke-dasharray="4 4"/><text x="212" y="400" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">out of scope for this library</text><text x="32" y="428" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">The library never rejects a request and never verifies a signature. It runs before validation so the snapshot is available to it.</text></svg>
