<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="figTitle figDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><title id="figTitle">Canonical key namespace</title><desc id="figDesc">The four families of canonical keys and the part of the request each is derived from.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="#5A6773" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="32" y="56" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">TRANSPORT</text><rect x="32" y="72" width="216" height="144" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><rect x="44" y="88" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="58" y="104" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">http.*</text><text x="58" y="120" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">method, scheme, host, path, query</text><rect x="44" y="144" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="58" y="160" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">net.*</text><text x="58" y="176" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">addresses and ports</text><text x="264" y="56" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">CORRELATION</text><rect x="264" y="72" width="216" height="144" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><rect x="276" y="88" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="290" y="104" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">trace.*</text><text x="290" y="120" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">W3C Trace Context</text><rect x="276" y="144" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="290" y="160" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">correlation.id</text><text x="290" y="176" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">request identifier</text><text x="496" y="56" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">PDND TOKENS</text><rect x="496" y="72" width="216" height="200" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><rect x="508" y="88" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="522" y="104" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.voucher.*</text><text x="522" y="120" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">voucher claims</text><rect x="508" y="144" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="522" y="160" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.trackingEvidence.*</text><text x="522" y="176" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">tracking evidence claims</text><rect x="508" y="200" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="522" y="216" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.dpop.*</text><text x="522" y="232" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">proof of possession</text><text x="728" y="56" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#71808F" dominant-baseline="central">INTEGRITY</text><rect x="728" y="72" width="216" height="200" rx="8" fill="#1A2029" stroke="#2B333C" stroke-width="1"/><rect x="740" y="88" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="754" y="104" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.digest.*</text><text x="754" y="120" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">RFC 3230 body digest</text><rect x="740" y="144" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="754" y="160" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.content_digest.*</text><text x="754" y="176" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">RFC 9530 body digest</text><rect x="740" y="200" width="192" height="44" rx="6" fill="#141920" stroke="#2B333C" stroke-width="1"/><text x="754" y="216" text-anchor="start" font-size="10.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5AA2F0" dominant-baseline="central">pdnd.signature.*</text><text x="754" y="232" text-anchor="start" font-size="10" fill="#9AA6B2" dominant-baseline="central">ModI signature claims</text><text x="32" y="32" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#9AA6B2" dominant-baseline="central">CANONICAL KEY NAMESPACE</text><line x1="32" y1="336" x2="928" y2="336" stroke="#2B333C" stroke-width="1"/><text x="32" y="360" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">Keys are lowercase and hierarchical. An absent claim produces no key, so absence and emptiness are indistinguishable by design.</text><text x="32" y="378" text-anchor="start" font-size="10" fill="#71808F" dominant-baseline="central">The single exception is metadata.truncated, emitted when header capture stopped at a configured bound.</text></svg>
