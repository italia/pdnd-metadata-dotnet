<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="figTitle figDesc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"><title id="figTitle">Extraction pipeline</title><desc id="figDesc">Inbound headers are decoded into a canonical snapshot of stable keys, consumed by logs and traces.</desc><defs><marker id="tip" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L6.5 4L1 7" fill="none" stroke="#A9B4C0" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="32" y="40" text-anchor="start" font-size="9.5" font-weight="500" letter-spacing="0.1em" fill="#8A97A6" dominant-baseline="central">INBOUND HEADERS</text><rect x="32" y="56" width="216" height="264" rx="8" fill="#F5F7F9" stroke="#DCE3EA" stroke-width="1"/><rect x="48" y="76" width="184" height="36" rx="6" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="1"/><text x="60" y="94" text-anchor="start" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5F6C7B" dominant-baseline="central">Authorization</text><rect x="48" y="124" width="184" height="36" rx="6" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="1"/><text x="60" y="142" text-anchor="start" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5F6C7B" dominant-baseline="central">Agid-JWT-Signature</text><rect x="48" y="172" width="184" height="36" rx="6" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="1"/><text x="60" y="190" text-anchor="start" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5F6C7B" dominant-baseline="central">Agid-JWT-Tracking-Evidence</text><rect x="48" y="220" width="184" height="36" rx="6" fill="#FFFFFF" stroke="#DCE3EA" stroke-width="1"/><text x="60" y="238" text-anchor="start" font-size=