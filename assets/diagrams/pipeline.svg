 dominant-baseline="central">correlation.id</text><text x="616" y="292" text-anchor="start" font-size="10" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" fill="#5F6C7B" dominant-baseline="central">b7c1…</text><line x1="872" y1="156" x2="904" y2="132" stroke="#A9B4C0" stroke-width="1.25" marker-end="url(#tip)"/><line x1="872" y1="220" x2="904" y2="244" stroke="#A9B4C0" stroke-width="1.25" marker-end="url(#tip)"/><text x="912" y="132" text-anchor="start" font-size="10" fill="#8A97A6" dominant-baseline="central">logs</text><text x="912" y="244" text-anchor="start" font-size="10" fill="#8A97A6" dominant-baseline="central">traces</text><line x1="32" y1="352" x2="928" y2="352" stroke="#DCE3EA" stroke-width="1"/><text x="32" y="376" text-anchor="start" font-size="10" fill="#8A97A6" dominant-baseline="central">Absent claims produce no key. Validation happens elsewhere: in your authentication layer, a gateway, or dedicated middleware.</text></svg>
