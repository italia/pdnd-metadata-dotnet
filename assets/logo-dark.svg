<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Pdnd.Metadata">
  <title>Pdnd.Metadata</title>
  <desc>A three-segment compact token resolving into two normalized key and value rows.</desc>

  <!-- Compact JWS token: header . payload . signature (opaque, unparsed) -->
  <g fill="#6B7885">
    <rect x="8" y="16" width="24" height="12" rx="6"/>
    <rect x="38" y="16" width="32" height="12" rx="6"/>
    <rect x="76" y="16" width="12" height="12" rx="6"/>
  </g>

  <!-- Normalized metadata: key marker + value -->
  <g>
    <rect x="8" y="44" width="12" height="12" rx="3" fill="#4D9BEF"/>
    <rect x="26" y="44" width="40" height="12" rx="6" fill="#4D9BEF" opacity="0.35"/>

    <rect x="8" y="68" width="12" height="12" rx="3" fill="#4D9BEF"/>
    <rect x="26" y="68" width="54" height="12" rx="6" fill="#4D9BEF" opacity="0.35"/>
  </g>
</svg>
